# docker compose up --build          → shop on http://localhost:8080
# docker compose run --rm test       → unit tests + architecture rules, no image build needed
# docker compose run --rm gradle <task>  → any other Gradle task with a cached dependency store
# podman-compose does not activate a service's profile on `run`: `podman-compose --profile tools run --rm test`.
services:
  shop-java:
    build: .
    image: dca-shop-java
    ports:
      - "8080:8080"
    environment:
      # SPRING_PROFILES_ACTIVE: jdbc
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      # Both default to the safe value. Set them only to run the shop inside an
      # iframe on another origin (a demo): a Lax cookie is withheld there, so every
      # request arrives anonymous and the cart is never found.
      #   JWT_SAME_SITE=None JWT_SECURE_COOKIES=true docker compose up
      JWT_SAME_SITE: ${JWT_SAME_SITE:-Lax}
      JWT_SECURE_COOKIES: ${JWT_SECURE_COOKIES:-false}

  gradle:
    image: eclipse-temurin:25-jdk
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["build"]

  # Spelled out rather than `extends: gradle` — podman-compose 1.6 cannot resolve extends.
  test:
    image: eclipse-temurin:25-jdk
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["test", "test-architecture"]

volumes:
  gradle-cache:
