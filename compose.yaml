# docker compose up --build          → shop on http://localhost:8080
# docker compose run --rm test       → unit tests + architecture rules, no image build needed
# docker compose --profile tools run --rm e2e  → the browser suite against the shop service; the image brings the browsers
# docker compose run --rm gradle <task>  → any other Gradle task with a cached dependency store
# podman-compose does not activate a service's profile on `run`: `podman-compose --profile tools run --rm test`.
services:
  shop-java:
    build: .
    image: dca-shop-java
    ports:
      - "8080:8080"
    environment:
      # SPRING_PROFILES_ACTIVE: jdbc
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      # The sample runs embeddable out of the box: another page may frame it, and on another port of
      # the same host its Lax cookies travel into the frame unchanged. Nothing to set for a demo.
      # A real deployment hardens both: JWT_ALLOW_FRAMING=false JWT_SECURE_COOKIES=true.
      # A page on another *site* (a different domain) additionally needs JWT_SAME_SITE=None, which
      # requires Secure cookies and therefore HTTPS.
      JWT_ALLOW_FRAMING: ${JWT_ALLOW_FRAMING:-true}
      JWT_SAME_SITE: ${JWT_SAME_SITE:-Lax}
      JWT_SECURE_COOKIES: ${JWT_SECURE_COOKIES:-false}

  gradle:
    image: eclipse-temurin:25-jdk
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["build"]

  # The E2E suite needs a browser, which the JDK image does not have. This image ships the browser builds of the
  # Playwright release the suite compiles against — keep the tag and `test-e2e.gradle` on one version.
  # `docker compose --profile tools run --rm e2e` runs it against the shop service over the compose network.
  e2e:
    image: mcr.microsoft.com/playwright/java:v1.62.0-noble
    profiles: [tools]
    working_dir: /workspace
    depends_on: [shop-java]
    # Share the shop's network namespace, so the shop is `localhost:8080` in here too. The embedded-shop tests put
    # their own page on another port of that same host, which is what makes the frame same-site.
    network_mode: "service:shop-java"
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["test-e2e", "-De2e.baseUrl=http://localhost:8080"]

  # Spelled out rather than `extends: gradle` — podman-compose 1.6 cannot resolve extends.
  test:
    image: eclipse-temurin:25-jdk
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["test", "test-architecture"]

volumes:
  gradle-cache:
