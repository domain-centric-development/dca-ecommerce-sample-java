# The rule selection of the shop's architecture suite. ArchitectureRulesTest reads it from the
# test class path (src/test-architecture/resources). The file is read as ISO-8859-1, hence the
# \u2014 escape for the dash below.

# The shop runs the experimental rules as well: it is where they are proven before they are released.
dca.rules.experimental = true

dca.rules.off = DCA-HEX-015
dca.rule.DCA-HEX-015.reason = retired in the libraries (since 0.9.0) \u2014 an operational requirement, not architecture; this shop runs on 0.8.0 until then
