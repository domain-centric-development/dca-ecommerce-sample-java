# The rule selection of the shop's architecture suite. ArchitectureRulesTest reads it from the
# test class path (src/test-architecture/resources).

# The shop runs the experimental rules as well: it is where they are proven before they are released.
dca.rules.experimental = true

# The buyer step's GET resumes the open checkout of the customer's cart - the one step-page GET that
# changes a session (ADR-046). Only that handler and that port; every other GET stays held.
dca.rule.DCA-HEX-014.ignore = BuyerInfoPageController\\.showBuyerInfoForm handles @GetMapping and drives a command through ResumeCheckoutInputPort\\.execute
