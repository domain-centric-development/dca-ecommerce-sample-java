server:
  port: 8080

spring:
  application:
    name: dca-ecommerce-sample-java
  # Pug4j debug error page (development only - shows template source on errors)
  pug4j:
    debug-error-page: true
  datasource:
    url: jdbc:h2:mem:aiarch;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: embedded
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: false # bounded recovery uses retained attempts and backoff
      completion-mode: update
      staleness:
        published: PT1M
        processing: PT1M
        resubmission: PT1M
        check-intervall: PT1S
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: SYNC
        stdio: false
        name: dca-ecommerce-sample-mcp-server
        version: 1.0.0
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.domaincentric.sample.ecommerce: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# JWT Security Configuration
app:
  security:
    jwt:
      # IMPORTANT: In production, use a strong secret from environment variable
      # The secret must be at least 256 bits (32 bytes) for HS256
      secret: ${JWT_SECRET:dev-only-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
      # The visitor identity carries the cart and survives session expiry (ADR-029)
      anonymous-expiration-days: 30
      # The authenticated session is shorter; its expiry costs the visitor nothing
      registered-expiration-days: 7
      issuer: dca-ecommerce-sample
      # Identity and session are separate cookies (ADR-030)
      cookie-name: shop-identity
      session-cookie-name: shop-session
      # Must be true wherever the app is reachable over HTTPS; false only for local HTTP
      secure-cookies: ${JWT_SECURE_COOKIES:false}
    password:
      bcrypt-strength: 12
      min-length: 8
    backoffice:
      username: admin
      password: admin
