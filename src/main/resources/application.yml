server:
  port: 8080

spring:
  application:
    name: dca-ecommerce-sample-java
  # Pug4j debug error page (development only - shows template source on errors)
  pug4j:
    debug-error-page: true
  datasource:
    url: jdbc:h2:mem:aiarch;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: embedded
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: false # bounded recovery uses retained attempts and backoff
      completion-mode: update
      staleness:
        published: PT1M
        processing: PT1M
        resubmission: PT1M
        check-intervall: PT1S
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: SYNC
        stdio: false
        name: dca-ecommerce-sample-mcp-server
        version: 1.0.0
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.domaincentric.sample.ecommerce: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# JWT Security Configuration
app:
  security:
    jwt:
      # The fallback is committed, therefore public: anyone can mint a token this shop accepts.
      # It is JwtProperties.DEVELOPMENT_SECRET, and JwtDevelopmentDefaultsValidator refuses it
      # outside the dev and inmemory profiles. The secret must be at least 256 bits for HS256.
      secret: ${JWT_SECRET:dev-only-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
      # The visitor identity carries the cart and survives session expiry (ADR-029)
      anonymous-expiration-days: 30
      # The authenticated session is shorter; its expiry costs the visitor nothing
      registered-expiration-days: 7
      issuer: dca-ecommerce-sample
      # Identity and session are separate cookies (ADR-030)
      cookie-name: shop-identity
      session-cookie-name: shop-session
      # Must be true wherever the app is reachable over HTTPS; false only for local HTTP, and
      # refused outside the dev and inmemory profiles
      secure-cookies: ${JWT_SECURE_COOKIES:false}
      # Lax everywhere. None only when the embedding page is on another site — a different
      # domain, not merely another port — where the browser would otherwise withhold the
      # identity cookie and every request arrives anonymous. Requires secure-cookies=true.
      same-site: ${JWT_SAME_SITE:Lax}
      # Whether another origin may frame the shop. On by default so the sample runs embedded
      # out of the box — a slide deck on another port, a docs page, a local demo; its cookies
      # are same-site already and need no relaxing. A real deployment turns this off, together
      # with secure-cookies=true: JWT_ALLOW_FRAMING=false JWT_SECURE_COOKIES=true.
      allow-framing: ${JWT_ALLOW_FRAMING:true}
    password:
      bcrypt-strength: 12
      min-length: 8
    backoffice:
      # The operator login replays failed publications, so it is the most privileged door in the
      # shop. These values are committed and therefore public; BackofficeDevelopmentDefaultsValidator
      # refuses them outside the dev and inmemory profiles.
      username: ${BACKOFFICE_USERNAME:admin}
      password: ${BACKOFFICE_PASSWORD:admin}
