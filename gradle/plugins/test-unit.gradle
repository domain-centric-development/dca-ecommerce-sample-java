// Apply common test dependencies
addCommonTestDependencies('testImplementation')

dependencies {
  // HTML parsing for rendered-markup assertions on Pug templates
  testImplementation 'org.jsoup:jsoup:1.18.3'
  // an external system in integration and end-user tests: a real HTTP server on a free port
  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'

  // The JDBC adapters run their contract test against the production schema on H2 (ADR-031).
  // Runtime only: the tests reach the driver through spring-jdbc, never through the H2 API.
  testRuntimeOnly 'com.h2database:h2'
}

// Configure Groovy compilation

// Configure main test task
configureTestTask(test, "test")

test {
  jvmArgs "-Xshare:off"

  // Debug logging support
  if (project.hasProperty('log-debug')) {
    beforeTest { descriptor ->
      logger.lifecycle("# ${descriptor.className}: ${descriptor.name}")
    }
    testLogging {
      events 'started', 'passed', 'skipped', 'failed'
    }
  } else {
    testLogging {
      events 'skipped', 'failed'
    }
  }
}
