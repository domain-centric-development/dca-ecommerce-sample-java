plugins {
  id 'java'
  id 'idea'
  id 'org.springframework.boot' version '4.0.2'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'io.franzbecker.gradle-lombok' version '5.0.0'
  id 'com.diffplug.spotless' version '8.2.1'
}

// Test Configurations
apply from: "gradle/plugins/test-common.gradle"
apply from: "gradle/plugins/test-unit.gradle"
apply from: "gradle/plugins/test-architecture.gradle"
apply from: "gradle/plugins/test-integration.gradle"
apply from: "gradle/plugins/test-e2e.gradle"

// Project Configuration
group = 'dev.domaincentric.sample'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

lombok {
  version = '1.18.42'
  sha256 = ""
}

spotless {
  java {
    googleJavaFormat('1.34.1')
    target 'src/*/java/**/*.java'
  }
}

springBoot {
  mainClass = 'dev.domaincentric.sample.ecommerce.infrastructure.EcommerceSampleApplication'
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

// Ensure SNAPSHOTs (changing modules) are not cached during development
configurations.all {
  resolutionStrategy {
    cacheChangingModulesFor 0, 'seconds'
  }
}

// Repositories
repositories {
  // Prefer locally installed SNAPSHOTs first
  mavenLocal()
  mavenCentral()
  // Spring milestones for Spring AI 2.0.0-M2
  maven { url 'https://repo.spring.io/milestone' }
}

ext {
  set('springCloudVersion', "2025.1.1")
  set('springAiVersion', "2.0.0-M2")
  set('springModulithVersion', "2.0.3")
}

// Dependencies
dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework:spring-tx'
  // Persistence: Spring Data JPA + H2 in-memory database
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  runtimeOnly 'com.h2database:h2'
  compileOnly 'org.springframework.boot:spring-boot-configuration-processor'

  // JWT
  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

  // Lombok
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  // DCA building blocks: DDD markers and hexagonal port interfaces — and the Spring implementations
  // of the two runtime contracts (DomainEventPublisher, TransactionBoundary), auto-configured
  implementation 'dev.domaincentric:dca-building-blocks:0.2.0'
  implementation 'dev.domaincentric:dca-spring:0.1.0'

  // JSpecify for nullability annotations
  implementation('org.jspecify:jspecify:1.0.0')

  // Apache Commons
  implementation('org.apache.commons:commons-collections4:4.5.0')
  implementation('org.apache.commons:commons-lang3:3.17.0')

  // Pug4j Template Engine
  implementation 'de.neuland-bfi:spring-pug4j:3.7.1'

  // Spring AI MCP Server
  implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

  // Spring Modulith
  implementation 'org.springframework.modulith:spring-modulith-starter-core'
  implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'

  // Inspect the retained registry state machine in the recovery integration test.
  testIntegrationImplementation "org.springframework.modulith:spring-modulith-events-core"

  // Test dependencies are configured in test-common.gradle
}

// Dependency Management
dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
  }
}

// Application Configuration
jar {
  enabled = false
}

bootRun {
  jvmArgs "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005"
  if (project.hasProperty('log-debug')) {
    args '--debug'
  }
  // Forward only application-relevant -D properties. Passing all of System.properties leaks the
  // Gradle daemon's java.home into the toolchain JVM and breaks JCE initialisation there.
  systemProperties System.properties.findAll { k, v ->
    k.toString().startsWith('spring.') || k.toString().startsWith('e2e.')
  }
}

// IntelliJ IDEA module configuration (Gradle 9+ compatible)
// We avoid deprecated properties like `testSourceDirs` and instead tweak the IML via withXml.
// IntelliJ will still primarily rely on Gradle sourceSets, but this ensures folders appear as Test (green).
idea {
  module {
      testSources.from(sourceSets.test.java.srcDirs)
      testResources.from(sourceSets.test.resources.srcDirs)

      testSources.from(sourceSets.testIntegration.java.srcDirs)
      testResources.from(sourceSets.testIntegration.resources.srcDirs)

      testSources.from(sourceSets.testArchitecture.java.srcDirs)
      testResources.from(sourceSets.testArchitecture.resources.srcDirs)

      testSources.from(sourceSets.testE2e.java.srcDirs)
      testResources.from(sourceSets.testE2e.resources.srcDirs)
  }
}


// Optional shared sample specification check (local only, not part of the build): -Pspecification.path=../dca-sample-specification
apply from: "gradle/specification.gradle"
